    name: 初めての案内
    content: |
      初めてのご利用ありがとうございます。
      ペットの種類・年齢・ご希望の内容と、ワクチン接種の状況をお知らせください。受付に必要な情報を確認してご案内します。
  - short_code: menu-ryoukin
    name: メニュー・料金
