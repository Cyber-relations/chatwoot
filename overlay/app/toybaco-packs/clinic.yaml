# 業界パック: クリニック・歯科・治療院
# ◯ と <URL> は開通15分(runbook §4)で店舗の実情報へ置き換える。
id: clinic
label: クリニック・歯科・治療院
emoji: "🩺"
accent: blue

canned_responses:
  - short_code: shoshin-yoyaku
    name: 初診予約
    content: |
      初めて受診される方のお問い合わせを承ります。
      ご希望の日時と受診を希望される方のお名前をお知らせください。
      空き状況を確認してご案内します。
  - short_code: saishin-yoyaku
    name: 再診予約
    content: |
      再診のご予約を承ります。
      ご希望の日時と受診を希望される方のお名前をお知らせください。
      空き状況を確認してご案内します。
  - short_code: yoyaku-kakutei
    name: 予約確定
    content: |
      ご予約を承りました。
      ご予約日時は◯月◯日◯曜日の◯時◯分、受付内容は◯です。
      当日は受付へお越しください。
  - short_code: yoyaku-henkou
    name: 予約変更
    content: |
      ご予約変更のご連絡ありがとうございます。
      現在の予約日時とご希望の変更日時をお知らせください。
      空き状況を確認して、あらためてご案内します。
  - short_code: yoyaku-cancel
    name: 予約キャンセル
    content: |
      ご予約のキャンセルを承りました。
      ご連絡ありがとうございました。
      あらためて受診をご希望の際は、ご希望日時をお知らせください。
  - short_code: shoujou-soudan
    name: 症状相談
    content: |
      症状についてのご相談ありがとうございます。
      詳しい内容は受診時にお伺いしますので、ご希望の日時をお知らせください。
      空き状況を確認してご案内します。
  - short_code: mochimono-annai
    name: 持ち物案内
    content: |
      受診時のお持ち物は◯です。
      初めて受診される方は、受付方法もあわせてこちらからご確認ください: <URL>
  - short_code: shinryou-jikan
    name: 診療時間
    content: |
      診療時間は◯時◯分から◯時◯分まで、休診日は◯曜日です。
      最新の診療時間はこちらからご確認ください: <URL>
  - short_code: access-annai
    name: アクセス案内
    content: |
      所在地は◯です。
      アクセス方法と地図はこちらからご確認ください: <URL>

labels:
  - title: 予約受付
    description: 初診と再診の予約問い合わせ
    color: "#E05C7A"
  - title: 予約変更
    description: 予約の変更とキャンセル
    color: "#F09A3E"
  - title: 初診
    description: 初めて受診される方からの問い合わせ
    color: "#2FA35C"
  - title: 受診案内
    description: 受診方法と持ち物の案内
    color: "#4A79B8"
  - title: 確認待ち
    description: 日時や受付内容の確認が必要な問い合わせ
    color: "#8A6FBF"

out_of_office_message: |
  メッセージありがとうございます。ただいま診療時間外のため、受付開始後に順番にご返信します。
  ご予約の希望や変更、キャンセルは、このままメッセージをお送りください。

post_templates:
  - title: 予約空き枠のお知らせ
    body: |
      【◯月◯日の予約空き状況】
      ◯時◯分と◯時◯分に空きがあります。
      受診をご希望の方はメッセージでご相談ください。
  - title: 診療時間のお知らせ
    body: |
      【◯月の診療時間について】
      ◯月◯日は診療時間を◯時から◯時までに変更します。
      ご予約や変更はメッセージでご相談ください。
  - title: 検診・予防接種の受付案内
    body: |
      【◯のご予約を受け付けています】
      ◯月◯日から、◯のご予約を受け付けています。
      ご予約とご不明な点はメッセージでお問い合わせください。
