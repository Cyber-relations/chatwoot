  - short_code: sharyou-toiawase
    content: |
      お車についてのお問い合わせありがとうございます。
      ご希望の車種と確認したい内容をお知らせください。
      展示状況を確認して、担当者からご案内します。
  - short_code: shijou-yoyaku
