out_of_office_message: |
  メッセージありがとうございます。ただいま営業時間外のため、営業開始後に順番にご返信します。
  ご予約の希望・変更・キャンセルは、このままメッセージをお送りください。

post_templates:
  - title: 空き枠のお知らせ
    body: |
      【◯月◯日(◯) ご予約に空きがあります】
      ◯:◯〜 と ◯:◯〜 にお席をご用意できます。
      メッセージからお気軽にご相談ください。
  - title: キャンペーン告知
    body: |
      【◯月のキャンペーン】
      ◯月◯日〜◯月◯日、◯メニューが◯円です。
      ご予約はメッセージからどうぞ。
  - title: 定休日・営業時間のお知らせ
    body: |
      【◯月の営業について】
      ◯月◯日(◯)はお休みをいただきます。
      前後の日程は空きがございますので、お早めにご相談ください。
