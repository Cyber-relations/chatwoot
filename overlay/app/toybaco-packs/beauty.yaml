  - title: 変更キャンセル
    description: 予約の変更・キャンセル連絡
    color: "#F09A3E"
  - title: 初めての方
    description: 新規のお客様からの問い合わせ
    color: "#2FA35C"
  - title: お直し相談
    description: 仕上がりのお直し依頼・ご意見
    color: "#4A79B8"
  - title: 求人応募
    description: 採用に関する問い合わせ
