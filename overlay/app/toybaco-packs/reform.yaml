    description: 工事内容と見積もりに関する問い合わせ
    color: "#E05C7A"
  - title: 現地調査
    description: 現地調査の日程に関する連絡
    color: "#F09A3E"
  - title: 工期確認
    description: 工期と進捗に関する問い合わせ
    color: "#2FA35C"
  - title: 日程変更
    description: 工事日程の変更に関する連絡
    color: "#4A79B8"
  - title: アフター対応
    description: 工事後の相談と確認依頼
    color: "#8A6FBF"

out_of_office_message: |
  メッセージありがとうございます。ただいま営業時間外のため、営業開始後に順番にご返信します。
  お見積もり、工期、工事後のご相談は、このまま内容をお送りください。

