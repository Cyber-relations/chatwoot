# 業界パック: 住宅設備・リフォーム
# ◯ と <URL> は開通15分(runbook §4)で店舗の実情報へ置き換える。
id: reform
label: 住宅設備・リフォーム
emoji: "🔧"
accent: green

canned_responses:
  - short_code: mitsumori-uketsuke
    name: 見積受付
    content: |
      お問い合わせありがとうございます。
      ご希望の工事内容、建物の種類、現地調査の希望日時をお知らせください。
      内容を確認して、担当者からご案内します。
  - short_code: genchi-chosa-chosei
    name: 現地調査調整
    content: |
      現地調査の日程についてご連絡ありがとうございます。
      ご都合のよい候補日時を◯つお知らせください。
      空き状況を確認して、あらためてご案内します。
  - short_code: mitsumori-annai
    name: 見積案内
    content: |
      お見積もりのご案内です。
      内容は<URL>からご確認ください。
      ご不明な点がありましたら、このメッセージにご返信ください。
  - short_code: kouki-kakunin
    name: 工期確認
    content: |
      工期についてお問い合わせありがとうございます。
      工事内容と現地の状況を確認したうえで、予定を担当者からご案内します。
      ご希望の時期がありましたらお知らせください。
  - short_code: kouji-nittei-henko
    name: 工事日程変更
    content: |
      工事日程の変更についてご連絡ありがとうございます。
      ご希望の候補日時を◯つお知らせください。
      担当者が確認して、あらためてご案内します。
  - short_code: kouji-junbi
    name: 工事準備
    content: |
      工事前の準備についてご案内します。
      当日までにご準備いただく内容は◯です。
      ご不明な点がありましたら、事前にお知らせください。
  - short_code: shinchoku-kakunin
    name: 進捗確認
    content: |
      工事の進捗についてお問い合わせありがとうございます。
      現在の状況と次回の作業予定を確認して、担当者からご案内します。
      ご返信までお待ちください。
  - short_code: after-uketsuke
    name: アフター受付
    content: |
      工事後のご相談を承ります。
      気になる箇所の内容と確認しやすい写真をお送りください。
      内容を確認して、担当者からご連絡します。
  - short_code: eigyo-area
    name: 営業エリア
    content: |
      対応エリアは◯です。
      営業時間は◯時から◯時まで、定休日は◯曜日です。
      対象地域についてご不明な場合は、住所をお知らせください。

labels:
