# 業界パック: 冠婚葬祭・写真館
# ◯ と <URL> は開通15分(runbook §4)で店舗の実情報へ置き換える。
id: bridal-photo
label: 冠婚葬祭・写真館
emoji: "📷"
accent: pink

canned_responses:
  - short_code: akibi-kakunin
    content: |
      お問い合わせありがとうございます。
      ご希望の日程と、撮影・挙式・ご法要などのご利用内容、人数をお知らせください。
      空き状況を確認してご案内します。
  - short_code: ryokin-plan
    content: |
      料金とプランの一覧はこちらです。
      <URL>
      ご希望の内容をお知らせいただければ、担当者からご案内します。
  - short_code: uchiawase-chosei
    content: |
      打ち合わせの日程についてご連絡ありがとうございます。
      ご都合のよい候補日時を◯つお知らせください。
      空き状況を確認して、あらためてご案内します。
  - short_code: yoyaku-henkou
    content: |
      日程や内容の変更についてご連絡ありがとうございます。
      ご予約者名、現在の日程、変更をご希望の内容をお知らせください。
      内容を確認して、担当者からご案内します。
  - short_code: yoyaku-cancel
    content: |
      キャンセルについてご連絡ありがとうございます。
      ご予約者名とご利用予定日をお知らせください。
      キャンセル料の有無を確認して、担当者からご案内します。
  - short_code: junbi-mochimono
    content: |
      当日の準備と持ち物についてご案内します。
      ご用意いただくものは◯です。
      ご不明な点がありましたら、事前にお知らせください。
  - short_code: isho-soudan
    content: |
      衣装についてご相談ありがとうございます。
      ご希望の種類、サイズ、利用予定日をお知らせください。
      取り扱い状況を確認して、担当者からご案内します。
  - short_code: shiagari-kakunin
    content: |
      写真や商品の仕上がり時期についてお問い合わせありがとうございます。
      ご予約者名とご利用日をお知らせください。
      現在の状況を確認して、あらためてご案内します。
  - short_code: access-annai
    content: |
      所在地はこちらです。
      <URL>
      営業時間は◯時から◯時まで、定休日は◯曜日です。
      道順についてご不明な場合は、お気軽にお問い合わせください。

labels:
  - title: 空き日程
    description: 利用希望日と空き状況に関する問い合わせ
    color: "#E05C7A"
  - title: 料金相談
    description: 料金とプランに関する問い合わせ
    color: "#F09A3E"
  - title: 打ち合わせ
    description: 打ち合わせ内容と日程に関する連絡
    color: "#2FA35C"
  - title: 日程変更
    description: 利用日程の変更とキャンセルに関する連絡
    color: "#4A79B8"
  - title: 衣装と仕上がり
    description: 衣装の相談と写真・商品の仕上がりに関する問い合わせ
    color: "#8A6FBF"

out_of_office_message: |
  メッセージありがとうございます。ただいま営業時間外のため、営業開始後に順番にご返信します。
  空き日程、料金、打ち合わせのご相談は、このまま内容をお送りください。

post_templates:
