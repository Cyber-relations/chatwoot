    body: |
      【◯月の空き日程】
      ◯月◯日と◯月◯日にご案内できます。
      ご希望の日時をメッセージでお知らせください。
  - title: 撮影事例のお知らせ
    body: |
      【撮影事例のご紹介】
      ◯の撮影事例をご紹介します。
      プランの詳細は<URL>からご確認ください。
  - title: キャンペーン告知
    body: |
      【◯月の撮影キャンペーン】
      ◯月◯日から◯月◯日まで、◯プランをご案内します。
