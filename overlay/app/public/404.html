<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ページが見つかりません</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP",
        "Yu Gothic Medium", "Yu Gothic", -apple-system, system-ui, sans-serif;
      background: #faf7f2;
      color: #24303f;
      padding: 2rem 1.5rem;
      -webkit-font-smoothing: antialiased;
    }
    .page {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 28rem;
    }
    .error-number {
      font-size: 8rem;
      font-weight: 700;
      line-height: 1;
      letter-spacing: -0.04em;
      color: #1f3a5f;
      margin-bottom: 1.5rem;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      line-height: 1.3;
      text-align: center;
      margin-bottom: 0.5rem;
    }
    .description {
      font-size: 0.9375rem;
      color: #6b7684;
      line-height: 1.6;
      text-align: center;
      margin-bottom: 2.5rem;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      background: #163049;
      color: #fff;
      font-size: 0.9375rem;
      font-weight: 500;
      padding: 0.75rem 2rem;
      border-radius: 8px;
      text-decoration: none;
    }
    .btn:hover { background: #1f3a5f; }
    .btn svg { width: 1.125rem; height: 1.125rem; }
    .divider {
      width: 3rem;
      height: 2px;
      background: #e7e4dc;
      border-radius: 1px;
      margin: 2.5rem 0;
    }
    .help {
      font-size: 0.8125rem;
      color: #6b7684;
      text-align: center;
      line-height: 1.5;
    }
    @media (max-width: 480px) {
      .error-number { font-size: 5rem; }
      h1 { font-size: 1.25rem; }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="error-number">404</div>
    <h1>ページが見つかりません</h1>
    <p class="description">お探しのページは存在しないか、移動した可能性があります。</p>
    <a href="/" class="btn">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5 3 12m0 0 7.5-7.5M3 12h18" /></svg>
      ホームへ戻る
    </a>
    <div class="divider"></div>
    <p class="help">お心当たりがない場合は、サポートまでご連絡ください。</p>
  </div>
</body>
</html>
