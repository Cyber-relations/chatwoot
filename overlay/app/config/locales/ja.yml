      description: ダッシュボードアプリを使用すると、ユーザー情報、注文、または支払い履歴を表示するアプリケーションを作成して埋め込むことができ、カスタマーサポートエージェントにより多くのコンテキストを提供します。
    dyte:
      name: Dyte
      short_description: トイバコ から顧客とのビデオ通話/音声通話を直接開始します。
      description: Dyteは、オーディオおよびビデオ機能をアプリケーションに統合する製品です。この統合により、エージェントはトイバコから直接顧客とビデオ/音声通話を開始できます。
      meeting_name: "%{agent_name} がミーティングを開始しました"
    slack:
      name: Slack
      short_description: 通知を受け取り、Slackで直接会話に応答します。
      description: トイバコとSlackを統合して、チームを同期させます。この統合により、新しい会話の通知を受け取り、Slackのインターフェース内で直接応答することができます。
    webhooks:
      name: ウェブフック
      description: Webhookイベントは、トイバコアカウント内のアクティビティに関するリアルタイムの更新を提供します。希望するイベントを購読すると、トイバコは更新情報を含むHTTPコールバックを送信します。
    dialogflow:
      name: Dialogflow
      short_description: エージェントに転送する前に、最初のクエリを処理するチャットボットを構築します。
      description: Dialogflowでチャットボットを構築し、それらを受信トレイに簡単に統合します。これらのボットは、カスタマーサービスエージェントに転送する前に初期の問い合わせを処理できます。
    google_translate:
      name: Google 翻訳
      short_description: エージェント向けの顧客メッセージを自動的に翻訳します。
      description: Google翻訳を統合して、エージェントが顧客のメッセージを簡単に翻訳できるようにします。この統合は言語を自動的に検出し、エージェントまたは管理者の希望する言語に変換します。
    openai:
      name: OpenAI
      short_description: AI- による返信の提案、要約、メッセージ強化。
      description: OpenAIの大規模言語モデルの力を活用して、返信の提案、要約、メッセージの言い換え、スペルチェック、ラベル分類などの機能を提供します。
    linear:
      name: Linear
      short_description: Linear 課題を会話から直接作成してリンクできます。
      description: 会話ウィンドウから直接Linearに問題を作成します。あるいは、既存のLinearの問題をリンクして、より効率的な問題追跡プロセスを実現します。
      attachment_link_title: "%{name} との会話 (#%{conversation_id})"
    notion:
      name: Notion
      short_description: データベース、文書、ページをAIアシスタントと直接統合できます。
      description: Notion ワークスペースを接続すると、AIアシスタントがデータベース、ドキュメント、ページのコンテンツにアクセスしてインテリジェントな回答を生成し、より状況に応じたカスタマーサポートを提供できるようになります。
    shopify:
      name: Shopify
      short_description: Shopifyストアから注文の詳細と顧客データにアクセスします。
      description: Shopifyストアに接続すると、会話の中で注文の詳細、顧客情報、製品データに直接アクセスでき、サポートチームが顧客に迅速かつ状況に応じた支援を提供できるようになります。
    leadsquared:
      name: リードスクエア
      short_description: LeadSquared CRM で連絡先や会話を同期しましょう。
      description: LeadSquared CRM で連絡先や会話を同期しましょう。この統合により、新しい連絡先が追加されると自動的にLeadSquaredに見込み客が作成され、会話アクティビティを記録して営業チームに完全なコンテキストを提供します。
