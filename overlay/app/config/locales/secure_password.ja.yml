# トイバコ: devise-secure_password(パスワード要件)のエラー文言を日本語で出す。属性名「パスワード」+ 半角空白に続けて読める形にする。
# 上流 secure_password.en.yml と同じキー集合を保つ。spec/models/toybaco/user_password_policy_ja_spec.rb が突き合わせる。
ja:
  secure_password:
    character:
      one: "文字"
      other: "文字"

    types:
      uppercase: "英大文字"
      downcase: "英小文字"
      lowercase: "英小文字"
      number: "数字"
      special: "記号"

    password_has_required_content:
      errors:
        messages:
          unknown_characters: "に使用できない文字が%{count}%{subject}含まれています"
          minimum_characters: "には%{type}を%{count}%{subject}以上含めてください"
          maximum_characters: "の%{type}は%{count}%{subject}以内にしてください"
          minimum_length: "は%{count}%{subject}以上にしてください"
          maximum_length: "は%{count}%{subject}以内にしてください"
    password_disallows_frequent_reuse:
      errors:
        messages:
          password_is_recent: "直近%{count}回に使ったパスワードは再利用できません"
    password_disallows_frequent_changes:
      errors:
        messages:
          password_is_recent: "パスワードは%{timeframe}に1回しか変更できません"
    password_requires_regular_updates:
      alerts:
        messages:
          password_updated: "パスワードを更新しました。"
      errors:
        messages:
          password_expired: "パスワードの有効期限が切れています。%{timeframe}ごとに変更してください"
    datetime:
      precise_distance_in_words:
        half_a_minute: "30秒"
        less_than_x_seconds:
          one: "1秒"
          other: "%{count}秒"
        x_seconds:
          one: "1秒"
          other: "%{count}秒"
        less_than_x_minutes:
          one: "1分"
          other: "%{count}分"
        x_minutes:
          one: "1分"
          other: "%{count}分"
        about_x_hours:
          one: "1時間"
          other: "%{count}時間"
        x_days:
          one: "1日"
          other: "%{count}日"
        about_x_months:
          one: "1か月"
          other: "%{count}か月"
        x_months:
          one: "1か月"
          other: "%{count}か月"
        about_x_years:
          one: "1年"
          other: "%{count}年"
        over_x_years:
          one: "1年"
          other: "%{count}年"
        almost_x_years:
          one: "1年"
          other: "%{count}年"
