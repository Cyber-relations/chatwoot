# トイバコ: 管理コンソール(SuperAdmin / administrate)向けの日本語訳。
# administrate はリソース名を activerecord.models、項目名を activerecord.attributes から引く。
# Chatwoot 本体の ja.yml に activerecord キーは無いので競合しない。
ja:
  devise:
    mailer:
      reset_password_instructions:
        subject: '【トイバコ】パスワード設定のご案内'
  administrate:
    actions:
      # 既定は "%{name}を作成" だが Chatwoot のビューが name に生の英語名を渡すため、名前に依存しない文言へ
      new_resource: 新規作成
  # Chatwoot 版 _collection.html.erb は列ヘッダを helpers.label(無ければ英語 attr 名)で引く
  helpers:
    label:
      account:
        id: 番号
        name: 名前
        locale: 言語
        users: ユーザー数
        conversations: 会話数
        status: 状態
        created_at: 作成日時
        updated_at: 更新日時
      user:
        id: 番号
        name: 名前
        display_name: 表示名
        email: メールアドレス
        type: 種別
        confirmed_at: メール確認日時
        created_at: 作成日時
        updated_at: 更新日時
      agent_bot:
        id: 番号
        name: 名前
        description: 説明
        bot_type: 種別
        account: アカウント
        created_at: 作成日時
      platform_app:
        id: 番号
        name: 名前
        created_at: 作成日時
        updated_at: 更新日時
      account_user:
        id: 番号
        account: アカウント
        user: ユーザー
        role: 権限
  activerecord:
    models:
      account: アカウント(テナント)
      user: ユーザー
      agent_bot: エージェントボット
      platform_app: プラットフォームアプリ
      account_user: アカウント所属
      access_token: アクセストークン
      installation_config: インストール設定
    attributes:
      account:
        name: 名前
        locale: 言語
        status: 状態
        created_at: 作成日時
        updated_at: 更新日時
        users: ユーザー
        conversations: 会話
        suspension_history: 停止履歴
        account_users: 所属ユーザー
      user:
        name: 名前
        display_name: 表示名
        email: メールアドレス
        unconfirmed_email: 未確認メールアドレス
        password: パスワード
        confirmed_at: メール確認日時
        created_at: 作成日時
        updated_at: 更新日時
        type: 種別
        avatar_url: アバター
        account_users: 所属アカウント
        access_token: アクセストークン
        mfa: 多要素認証
      account_user:
        account: アカウント
        user: ユーザー
        role: 権限
        inviter: 招待者
      agent_bot:
        name: 名前
        description: 説明
        outgoing_url: 送信先 URL
        bot_type: 種別
        account: アカウント
        created_at: 作成日時
        updated_at: 更新日時
