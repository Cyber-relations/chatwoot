name: 受信箱の統合品質・標準イメージ公開

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - '.dockerignore'
      - '.github/CODEOWNERS'
      - '.github/workflows/chatwoot-integration.yml'
      - 'Dockerfile'
      - 'bin/toybaco-chatwoot-*'
      - 'infra/terraform/ecs.tf'
      - 'overlay/app/**'
      - 'config/chatwoot-runtime-gems.json'
      - 'config/chatwoot-ruby-llm-backport.json'
      - 'scripts/harden-chatwoot-ruby-llm.rb'
      - 'config/chatwoot-rails-backport.json'
      - 'scripts/harden-chatwoot-rails.rb'
      - 'scripts/verify-chatwoot-ruby-llm-classification.mjs'
      - 'scripts/chatwoot-alpine-status.py'
      - 'scripts/spdx-os-source.py'
      - 'config/chatwoot-runtime-apk.txt'
      - 'config/chatwoot-runtime-apk-cve-floors.tsv'
      - 'config/chatwoot-runtime-apk-unowned-files.tsv'
      - 'docs/chatwoot-runtime-os-policy.md'
      - 'scripts/verify-chatwoot-ee-view-twins.sh'
      - 'docs/chatwoot-ruby-llm-backport-policy.md'
      - 'docs/chatwoot-rails-backport-policy.md'
      - 'scripts/harden-chatwoot-runtime-gems.rb'
      - 'scripts/generate-chatwoot-active-ja-overrides.rb'
      - 'scripts/generate-chatwoot-ja-overrides.rb'
      - 'tests/chatwoot*'
      - 'tests/verify_chatwoot*'
      - 'tests/postiz_identity_contract.sql'
  schedule:
    - cron: '17 21 * * 1'
  workflow_dispatch:
    inputs:
      publish_reviewed_main:
        description: ECR replication設定後にreview済みmainを再発行する
        required: true
        type: boolean
        default: false

concurrency:
  group: chatwoot-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  edge-contract:
    name: HTTP header CRLF contract
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: node tests/chatwoot-live-edge.test.mjs

  quality:
    if: github.event_name != 'schedule'
    name: 固定source・overlay・RSpec・日本語・amd64 runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - name: review対象sourceをread-only権限で取得
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 秘密なし固定containerでChatwoot品質ゲート
        run: ./bin/toybaco-chatwoot-gate --quality-only

      - name: 実image backport分類の否定契約を検証
        run: node tests/chatwoot-ruby-llm-classification.test.mjs .

      - name: 公開publisher契約を検証
        run: node tests/chatwoot-managed-publisher.test.mjs .

  publish:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_reviewed_main)
    needs: quality
    name: reviewed mainからbuild・scan・署名・ECR公開
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment:
      name: chatwoot-production
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    env:
      AWS_ACCOUNT_ID: '951034765053'
      AWS_REGION: ap-northeast-1
      ECR_REPOSITORY: 951034765053.dkr.ecr.ap-northeast-1.amazonaws.com/toybaco/chatwoot
      ECR_REPOSITORY_NAME: toybaco/chatwoot
      REPOSITORY_COMMIT: ${{ github.sha }}
      IMAGE_TAG: sha-${{ github.sha }}-${{ github.run_number }}
      CHATWOOT_SOURCE_TAG: v4.18.0
      CHATWOOT_SOURCE_TAG_OBJECT: 5c1487713ff2ea407188855211533a1e30e24589
      CHATWOOT_SOURCE_COMMIT: 9f920b549c14491a4e587687a3eed5d21c6ccc7d
      CHATWOOT_SOURCE_TREE: 16432eeeef9153f7aff66be382e04a20e6f5683a
      CHATWOOT_BASE_IMAGE: chatwoot/chatwoot@sha256:03a03a85a00f1d119367deb0d090a56e553468d0aa5e9194a57eba7c61deb7de
      CHATWOOT_RUNTIME_IMAGE: ruby:3.4.4-alpine3.22@sha256:017bd0bf72da696261a11a1575ab04d65b3340def62ce39219e8862fc0aa13d1
      TRIVY_IMAGE: docker.io/aquasec/trivy:0.67.2@sha256:ac2f9d0197456a8ce460884b113e49d65b667f506c31d014c9955869a7a5d682
    steps:
      - name: owner review済みmain sourceを取得
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: runner付属のgh・aws・dockerの版とimage storeをbuild前に確認
        shell: bash
        run: |
          set -Eeuo pipefail
          export LC_ALL=C
          # hosted runner(ubuntu-24.04)の gh・aws・docker は、runner image の週次の更新で版が変わる。この publisher は、buildx の
          # metadata の digest と ECR の DescribeImages・imagetools の manifest の照合、ECR の scan、pull した image の docker image
          # inspect と proof、attestation の検証を、下の major と従来の image store(overlay2)の挙動として読む。Docker 29 の containerd
          # image store では image ID の意味が変わる。image store が違う、gh か aws の major が違う、道具が無いか読めないときは、
          # 何が想定外かを固定語(TOYBACO_RUNNER_CLI=UNEXPECTED)で出して build の前に止める。docker の major の違いだけは警告
          # (TOYBACO_RUNNER_CLI=WARN)にとどめる。期待値は、新しい版の挙動を確かめてから契約テストと同じ変更で上げる。
          expected_gh_major='2'
          expected_aws_major='2'
          expected_docker_major='28'
          unexpected() {
            echo "::error::TOYBACO_RUNNER_CLI=UNEXPECTED $1"
            exit 1
          }
          # 版の文字列から major.minor.patch だけを取り出す。取り出せない出力はそのまま出さずに止める。
          parsed_major=''
          parsed_version=''
          parse_version() {
            if [[ ! "$2" =~ $3 ]]; then
              unexpected "${1}=unparsable"
            fi
            parsed_major="${BASH_REMATCH[1]}"
            parsed_version="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
          }
          # gh・aws は major が違うと出力の解析が壊れうるので止める。
          require_major() {
            if [[ "$parsed_major" != "$2" ]]; then
              unexpected "${1}_major=${parsed_major} expected_major=${2} version=${parsed_version}"
            fi
          }
          # docker の major の違いは警告だけにする(image store は下で別に止める)。overlay2 のままの新しい major で hotfix まで止めないため。
          warn_docker_major() {
            if [[ "$parsed_major" != "$expected_docker_major" ]]; then
              echo "::warning::TOYBACO_RUNNER_CLI=WARN docker_major=${parsed_major} component=${1} expected_major=${expected_docker_major} version=${parsed_version}"
              printf 'TOYBACO_RUNNER_CLI=WARN docker_major=%s component=%s expected_major=%s version=%s\n' \
                "$parsed_major" "$1" "$expected_docker_major" "$parsed_version" >> "$GITHUB_STEP_SUMMARY"
            fi
          }
          for tool in gh aws docker; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              unexpected "${tool}=missing"
            fi
          done
          gh_output="$(gh --version)" || unexpected 'gh=failed'
          parse_version gh "$gh_output" '^gh version ([0-9]+)\.([0-9]+)\.([0-9]+)'
          require_major gh "$expected_gh_major"
          gh_version="$parsed_version"
          aws_output="$(aws --version)" || unexpected 'aws=failed'
          parse_version aws "$aws_output" '^aws-cli/([0-9]+)\.([0-9]+)\.([0-9]+)'
          require_major aws "$expected_aws_major"
          aws_version="$parsed_version"
          docker_client_output="$(docker version --format '{{.Client.Version}}')" || unexpected 'docker_client=failed'
          parse_version docker_client "$docker_client_output" '^([0-9]+)\.([0-9]+)\.([0-9]+)([-+][0-9A-Za-z.+-]*)?$'
          warn_docker_major client
          docker_client_version="$parsed_version"
          docker_server_output="$(docker version --format '{{.Server.Version}}')" || unexpected 'docker_server=failed'
          parse_version docker_server "$docker_server_output" '^([0-9]+)\.([0-9]+)\.([0-9]+)([-+][0-9A-Za-z.+-]*)?$'
          warn_docker_major server
          docker_server_version="$parsed_version"
          # image store は従来の graph driver の overlay2 だけを受ける。containerd image store は Driver が overlayfs などになり、
          # DriverStatus に driver-type io.containerd.snapshotter.v1 が出る(image ID が config digest でなくなる)。
          docker_driver="$(docker info --format '{{.Driver}}')" || unexpected 'docker_info=failed'
          docker_driver_status="$(docker info --format '{{json .DriverStatus}}')" || unexpected 'docker_info=failed'
          if [[ "$docker_driver_status" == *io.containerd.snapshotter* ]]; then
            unexpected 'docker_image_store=containerd-snapshotter'
          fi
          if [[ "$docker_driver" != 'overlay2' ]]; then
            if [[ ! "$docker_driver" =~ ^[A-Za-z0-9._-]{1,64}$ ]]; then
              docker_driver='unparsable'
            fi
            unexpected "docker_storage_driver=${docker_driver} expected=overlay2"
          fi
          runner_image="${ImageOS:-unknown}-${ImageVersion:-unknown}"
          if [[ ! "$runner_image" =~ ^[A-Za-z0-9._-]{1,64}$ ]]; then
            runner_image='unknown'
          fi
          printf 'TOYBACO_RUNNER_CLI=OK gh=%s aws=%s docker_client=%s docker_server=%s docker_storage_driver=%s runner_image=%s\n' \
            "$gh_version" "$aws_version" "$docker_client_version" "$docker_server_version" "$docker_driver" "$runner_image" \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: main commit・固定Chatwoot source・exact overlayを再確認
        id: source
        shell: bash
        env:
          REQUEST_REF: ${{ github.ref }}
          REQUEST_REF_TYPE: ${{ github.ref_type }}
        run: |
          set -Eeuo pipefail
          if [[ "$REQUEST_REF_TYPE" != 'branch' || "$REQUEST_REF" != 'refs/heads/main' ]]; then
            echo '::error::publisherはreview済みmain branchからのみ実行できます。'
            exit 1
          fi
          [[ "$REPOSITORY_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "$REPOSITORY_COMMIT" ]]
          [[ -z "$(git status --porcelain=v1 --untracked-files=all)" ]]
          repository_tree="$(git rev-parse 'HEAD^{tree}')"
          [[ "$repository_tree" =~ ^[0-9a-f]{40}$ ]]
          expected_tag="sha-${REPOSITORY_COMMIT}-${GITHUB_RUN_NUMBER}"
          [[ "$IMAGE_TAG" == "$expected_tag" && "$IMAGE_TAG" =~ ^sha-[0-9a-f]{40}-[1-9][0-9]*$ ]]

          [[ "$CHATWOOT_SOURCE_TAG" == 'v4.18.0' ]]
          [[ "$CHATWOOT_SOURCE_TAG_OBJECT" == '5c1487713ff2ea407188855211533a1e30e24589' ]]
          [[ "$CHATWOOT_SOURCE_COMMIT" == '9f920b549c14491a4e587687a3eed5d21c6ccc7d' ]]
          [[ "$CHATWOOT_SOURCE_TREE" == '16432eeeef9153f7aff66be382e04a20e6f5683a' ]]
          [[ "$CHATWOOT_BASE_IMAGE" == 'chatwoot/chatwoot@sha256:03a03a85a00f1d119367deb0d090a56e553468d0aa5e9194a57eba7c61deb7de' ]]
          [[ "$CHATWOOT_RUNTIME_IMAGE" == 'ruby:3.4.4-alpine3.22@sha256:017bd0bf72da696261a11a1575ab04d65b3340def62ce39219e8862fc0aa13d1' ]]
          grep -Fqx "ARG CHATWOOT_IMAGE=$CHATWOOT_BASE_IMAGE" Dockerfile
          grep -Fqx "ARG RUBY_RUNTIME_IMAGE=$CHATWOOT_RUNTIME_IMAGE" Dockerfile
          grep -Fq "org.opencontainers.image.revision=\"$CHATWOOT_SOURCE_COMMIT\"" Dockerfile
          grep -Fq "jp.toybaco.source.tree=\"$CHATWOOT_SOURCE_TREE\"" Dockerfile
          ruby tests/verify_chatwoot_overlay_manifest.rb verify . tests/chatwoot-overlay-manifest.tsv

          control_output="$(./bin/toybaco-chatwoot-gate --control-sha-only)"
          [[ "$control_output" =~ ^TOYBACO_CHATWOOT_CONTROL_SHA256=([0-9a-f]{64})$ ]]
          control_sha="${BASH_REMATCH[1]}"
          printf 'repository_tree=%s\n' "$repository_tree" >> "$GITHUB_OUTPUT"
          printf 'control_sha=%s\n' "$control_sha" >> "$GITHUB_OUTPUT"

      # 表示だけで判定には使わない(CW-1)。版はSBOMのdistroとTrivyの--distroと同じ固定値
      # (出荷するruntimeのalpine-releaseはbase imageの版のまま。docs/chatwoot-runtime-os-policy.md)。
      - name: Alpine branchのEOLをStep Summaryへ出す(出荷は止めない)
        run: python3 -I scripts/chatwoot-alpine-status.py eol --release 3.22.0 || true

      - name: GitHub OIDCで本番publisher roleを取得
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: arn:aws:iam::951034765053:role/toybaco-github-actions-chatwoot-ecr
          aws-region: ap-northeast-1
          role-session-name: toybaco-chatwoot-${{ github.run_id }}
          role-duration-seconds: 3600
          mask-aws-account-id: true

      - name: 固定ECR registryへlogin
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.0.1
        with:
          registries: '951034765053'
          registry-type: private
          mask-password: true

      - name: linux/amd64 imageを一度だけbuild・pushしdigestとlabelを確認
        id: build
        shell: bash
        env:
          CONTROL_SHA: ${{ steps.source.outputs.control_sha }}
        run: |
          set -Eeuo pipefail
          [[ "$CONTROL_SHA" =~ ^[0-9a-f]{64}$ ]]
          metadata="$RUNNER_TEMP/chatwoot-build-metadata.json"
          image="$ECR_REPOSITORY:$IMAGE_TAG"
          docker buildx version
          docker buildx build --no-cache --pull --platform linux/amd64 \
            --file Dockerfile \
            --build-arg "CHATWOOT_IMAGE=$CHATWOOT_BASE_IMAGE" \
            --build-arg "RUBY_RUNTIME_IMAGE=$CHATWOOT_RUNTIME_IMAGE" \
            --build-arg "TOYBACO_CONTROL_SHA256=$CONTROL_SHA" \
            --build-arg "TOYBACO_PUBLIC_REVISION=$REPOSITORY_COMMIT" \
            --tag "$image" \
            --metadata-file "$metadata" \
            --provenance=false \
            --sbom=false \
            --push .
          [[ -f "$metadata" && ! -L "$metadata" ]]
          digest="$(jq -r '."containerimage.digest" // empty' "$metadata")"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo '::error::buildx metadata digestが不正です。'
            exit 1
          }
          # A registry index has a different digest from its platform manifest.
          # This single-platform publisher binds one manifest through every gate.
          manifest_json="$(docker buildx imagetools inspect "$ECR_REPOSITORY@$digest" --raw)"
          jq -e '.schemaVersion == 2 and .manifests == null and
            (.config.digest | test("^sha256:[0-9a-f]{64}$")) and
            (.layers | type == "array" and length > 0)' <<<"$manifest_json" >/dev/null
          image_json="$(docker buildx imagetools inspect "$ECR_REPOSITORY@$digest" --format '{{json .Image}}')"
          jq -e \
            --arg base "$CHATWOOT_RUNTIME_IMAGE" \
            --arg upstream "$CHATWOOT_BASE_IMAGE" \
            --arg revision "$CHATWOOT_SOURCE_COMMIT" \
            --arg tree "$CHATWOOT_SOURCE_TREE" \
            --arg control "$CONTROL_SHA" \
            '.os == "linux" and .architecture == "amd64" and
             .config.Labels["org.opencontainers.image.base.name"] == $base and
             .config.Labels["jp.toybaco.upstream.image"] == $upstream and
             .config.Labels["org.opencontainers.image.revision"] == $revision and
             .config.Labels["jp.toybaco.source.tree"] == $tree and
             .config.Labels["jp.toybaco.gate.control-sha256"] == $control' \
            <<<"$image_json" >/dev/null
          printf 'image_digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
          printf 'image_uri=%s@%s\n' "$ECR_REPOSITORY" "$digest" >> "$GITHUB_OUTPUT"

      - name: scan前に本番publisher roleを再取得
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: arn:aws:iam::951034765053:role/toybaco-github-actions-chatwoot-ecr
          aws-region: ap-northeast-1
          role-session-name: toybaco-chatwoot-scan-${{ github.run_id }}
          role-duration-seconds: 3600
          mask-aws-account-id: true

      - name: buildx digestをECRから再取得して照合
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.image_digest }}
        run: |
          set -Eeuo pipefail
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          described_digest="$(aws ecr describe-images \
            --region "$AWS_REGION" \
            --registry-id "$AWS_ACCOUNT_ID" \
            --repository-name "$ECR_REPOSITORY_NAME" \
            --image-ids "imageTag=$IMAGE_TAG" \
            --query 'imageDetails[0].imageDigest' \
            --output text)"
          [[ "$described_digest" == "$IMAGE_DIGEST" ]] || {
            echo "::error::buildxとECRのdigestが一致しません。buildx=$IMAGE_DIGEST ecr=$described_digest"
            exit 1
          }

      - name: ECR scan完了・Critical/Highゼロを確認
        id: scan
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.image_digest }}
        run: |
          set -Eeuo pipefail
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          scan_file="$RUNNER_TEMP/chatwoot-ecr-scan.json"
          error_file="$RUNNER_TEMP/chatwoot-ecr-scan.error"
          complete=0
          for ((attempt = 1; attempt <= 60; attempt += 1)); do
            if aws ecr describe-image-scan-findings \
              --region "$AWS_REGION" \
              --registry-id "$AWS_ACCOUNT_ID" \
              --repository-name "$ECR_REPOSITORY_NAME" \
              --image-id "imageDigest=$IMAGE_DIGEST" \
              --output json > "$scan_file" 2> "$error_file"; then
              status="$(jq -r '.imageScanStatus.status // empty' "$scan_file")"
              case "$status" in
                COMPLETE) complete=1; break ;;
                PENDING|IN_PROGRESS) sleep 10 ;;
                *) echo "::error::ECR scanがfail-closed statusになりました: $status"; exit 1 ;;
              esac
            elif grep -Fq 'ScanNotFoundException' "$error_file"; then
              sleep 10
            else
              echo '::error::ECR scan結果を取得できません。'
              exit 1
            fi
          done
          [[ "$complete" -eq 1 ]] || {
            echo '::error::ECR scanが10分以内に完了しません。'
            exit 1
          }
          critical="$(jq -r '.imageScanFindings.findingSeverityCounts.CRITICAL // 0' "$scan_file")"
          high="$(jq -r '.imageScanFindings.findingSeverityCounts.HIGH // 0' "$scan_file")"
          [[ "$critical" =~ ^[0-9]+$ && "$high" =~ ^[0-9]+$ ]]
          if [[ "$critical" -ne 0 || "$high" -ne 0 ]]; then
            echo "::error::ECR scan gate失敗: CRITICAL=$critical HIGH=$high"
            exit 1
          fi
          printf 'ECR scan verified: digest=%s CRITICAL=0 HIGH=0\n' "$IMAGE_DIGEST"

      - name: 固定SyftでSPDX SBOMを生成
        id: sbom
        env:
          SYFT_FILE_METADATA_SELECTION: none
          SYFT_RELATIONSHIPS_PACKAGE_FILE_OWNERSHIP: 'false'
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.22.2
        with:
          image: registry:${{ steps.build.outputs.image_uri }}
          format: spdx-json
          output-file: ${{ runner.temp }}/toybaco-chatwoot.spdx.json
          syft-version: v1.51.1
          dependency-snapshot: false
          upload-artifact: false
          upload-release-assets: false

      - name: SPDX SBOMの形式と上限を確認
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.image_digest }}
        run: |
          set -Eeuo pipefail
          sbom="$RUNNER_TEMP/toybaco-chatwoot.spdx.json"
          [[ -f "$sbom" && ! -L "$sbom" ]]
          size="$(stat -c %s "$sbom")"
          [[ "$size" -gt 0 && "$size" -le 16777216 ]]
          jq -e '.spdxVersion == "SPDX-2.3" and (.SPDXID | type == "string") and
            ((.packages // []) | length > 0)' "$sbom" >/dev/null
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          # Read the registry manifest directly. Docker daemon sources can
          # reconstruct a different manifest from an archive of the same image.
          # Both the requested digest and cataloged manifest must match buildx.
          jq -e --arg image "$ECR_REPOSITORY" --arg digest "${IMAGE_DIGEST#sha256:}" '
            . as $document |
            [.relationships[] | select(.spdxElementId == $document.SPDXID and
              .relationshipType == "DESCRIBES") | .relatedSpdxElement] as $roots |
            ($roots | length == 1) and
            ([.packages[] | select(.SPDXID == $roots[0] and .name == $image and
              .primaryPackagePurpose == "CONTAINER" and .versionInfo == ("sha256:" + $digest)) |
              select(any(.checksums[]; .algorithm == "SHA256" and .checksumValue == $digest))] | length == 1) and
            any(.packages[].externalRefs[]?; .referenceType == "purl" and
              (.referenceLocator | startswith("pkg:apk/alpine/")) and
              (.referenceLocator | split("?")[1] // "" | split("&") | index("distro=alpine-3.22.0") != null))
          ' "$sbom" >/dev/null

      - name: 固定Trivyの生結果と実imageのRubyLLM backportを検証
        id: trivy
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.image_digest }}
          CONTROL_SHA: ${{ steps.source.outputs.control_sha }}
        run: |
          set -Eeuo pipefail
          [[ "$TRIVY_IMAGE" == 'docker.io/aquasec/trivy:0.67.2@sha256:ac2f9d0197456a8ce460884b113e49d65b667f506c31d014c9955869a7a5d682' ]]
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$CONTROL_SHA" =~ ^[0-9a-f]{64}$ ]]
          security="$RUNNER_TEMP/chatwoot-source-backport"
          mkdir -m 0700 "$security"
          cp "$RUNNER_TEMP/toybaco-chatwoot.spdx.json" "$security/sbom.spdx.json"
          # Trivy reads OS source names only from SPDX sourceInfo; Syft writes them only as purl upstream=.
          # The raw scan reads a supplemented copy (exclusive create). The attested SBOM and the copy bound by
          # the classification stay byte-identical; an unreadable shape or zero supplemented packages fails here.
          python3 -I scripts/spdx-os-source.py "$security/sbom.spdx.json" "$security/scan-sbom.spdx.json"
          mkdir -m 0700 "$security/scan-output"
          db_download_started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          docker pull "$TRIVY_IMAGE"
          # Retain the downloaded source. Trivy opens bbolt read/write even with skip-update.
          frozen="$security/frozen-source"
          mkdir -m 0700 "$frozen"
          docker run --rm \
            --mount "type=bind,src=$frozen,dst=/root/.cache/trivy" \
            "$TRIVY_IMAGE" --config /dev/null image --download-db-only --no-progress
          node scripts/verify-chatwoot-ruby-llm-classification.mjs snapshot-before \
            "$frozen" config/chatwoot-ruby-llm-backport.json
          mkdir -m 0700 "$security/db"
          cp -- "$frozen/db/trivy.db" "$frozen/db/metadata.json" "$security/db/"
          # Existing signed database snapshots bind the actual scanned copy.
          node scripts/verify-chatwoot-ruby-llm-classification.mjs snapshot-before \
            "$security" config/chatwoot-ruby-llm-backport.json
          cmp -- "$frozen/db-before.json" "$security/db-before.json"

          scan_status=0
          # Raw scan: no VEX, ignore policy, credentials, repository config, or Docker socket.
          docker run --rm --network none --workdir /scan \
            --mount "type=bind,src=$security/scan-sbom.spdx.json,dst=/scan/sbom.spdx.json,readonly" \
            --mount "type=bind,src=$security/db,dst=/root/.cache/trivy/db" \
            --mount "type=bind,src=$security/scan-output,dst=/output" \
            "$TRIVY_IMAGE" --config /dev/null sbom \
            --scanners vuln --pkg-types os,library --distro alpine/3.22.0 \
            --severity CRITICAL,HIGH --ignore-unfixed=false --exit-code 1 --list-all-pkgs \
            --skip-db-update --skip-java-db-update --offline-scan \
            --format json --output /output/raw-report.json --no-progress /scan/sbom.spdx.json \
            || scan_status=$?
          printf '%s\n' "$scan_status" > "$security/raw-exit.txt"
          mv "$security/scan-output/raw-report.json" "$security/raw-report.json"
          node scripts/verify-chatwoot-ruby-llm-classification.mjs snapshot-after \
            "$security" config/chatwoot-ruby-llm-backport.json
          node scripts/verify-chatwoot-ruby-llm-classification.mjs snapshot-after \
            "$frozen" config/chatwoot-ruby-llm-backport.json
          cmp -- "$frozen/db-before.json" "$frozen/db-after.json"
          cmp -- "$frozen/db-after.json" "$security/db-after.json"
          jq --arg digest "$IMAGE_DIGEST" '{digest: $digest, raw_findings:
            [.Results[].Vulnerabilities[]? | {id: .VulnerabilityID, severity: .Severity,
              package: .PkgName, version: .InstalledVersion, path: .PkgPath, fixed: .FixedVersion}]}' \
            "$security/raw-report.json"

          docker pull "$ECR_REPOSITORY@$IMAGE_DIGEST"
          docker image inspect "$ECR_REPOSITORY@$IMAGE_DIGEST" > "$security/image-inspect.json"
          docker run --rm --platform linux/amd64 --network none --read-only \
            --cap-drop ALL --security-opt no-new-privileges --workdir /app --entrypoint ruby \
            --mount "type=bind,src=$GITHUB_WORKSPACE/config,dst=/contract/config,readonly" \
            --mount "type=bind,src=$GITHUB_WORKSPACE/scripts,dst=/contract/scripts,readonly" \
            --mount "type=bind,src=$GITHUB_WORKSPACE/tests,dst=/contract/tests,readonly" \
            "$ECR_REPOSITORY@$IMAGE_DIGEST" \
            -rbundler/setup /contract/tests/verify_chatwoot_ruby_llm_backport.rb /contract/config/chatwoot-ruby-llm-backport.json \
            > "$security/installed-proof.json"
          # The Rails proof writes tempfiles and Disk-service blobs, so it alone gets a private /tmp.
          docker run --rm --platform linux/amd64 --network none --read-only \
            --cap-drop ALL --security-opt no-new-privileges --workdir /app --entrypoint ruby \
            --tmpfs /tmp:rw,noexec,nosuid,size=16m \
            --mount "type=bind,src=$GITHUB_WORKSPACE/config,dst=/contract/config,readonly" \
            --mount "type=bind,src=$GITHUB_WORKSPACE/scripts,dst=/contract/scripts,readonly" \
            --mount "type=bind,src=$GITHUB_WORKSPACE/tests,dst=/contract/tests,readonly" \
            "$ECR_REPOSITORY@$IMAGE_DIGEST" \
            -rbundler/setup /contract/tests/verify_chatwoot_rails_backport.rb /contract/config/chatwoot-rails-backport.json \
            > "$security/installed-rails-proof.json"
          jq -n --arg image "$ECR_REPOSITORY" --arg digest "$IMAGE_DIGEST" \
            --arg source "$REPOSITORY_COMMIT" --arg control "$CONTROL_SHA" --arg trivy "$TRIVY_IMAGE" \
            --arg started "$db_download_started_at" --arg issued "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{schema_version:1,image:$image,image_digest:$digest,source_commit:$source,
              source_ref:"refs/heads/main",control_sha256:$control,trivy_image:$trivy,
              db_download_started_at:$started,issued_at:$issued}' > "$security/context.json"
          # This is an independent source-backport classification, not a Trivy-filtered scan.
          # Exactly seven proved fixed findings are allowed: ruby_llm CVE-2026-67987 / 67989 / 67991 and Rails 7.2.3.2
          # GHSA-8474-xrp6-wh69 / GHSA-wm3x-v3qw-4jh3 / GHSA-f3w6-w445-fwh9 / GHSA-v924-7rp8-4mxh; every other HIGH/CRITICAL still fails.
          node scripts/verify-chatwoot-ruby-llm-classification.mjs evaluate \
            "$security" config/chatwoot-ruby-llm-backport.json config/chatwoot-rails-backport.json

      - name: SLSA provenanceを署名してOCIへ保存
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.0.0
        with:
          subject-name: 951034765053.dkr.ecr.ap-northeast-1.amazonaws.com/toybaco/chatwoot
          subject-digest: ${{ steps.build.outputs.image_digest }}
          push-to-registry: true
          create-storage-record: true
          show-summary: false

      - name: SPDX SBOMを署名してOCIへ保存
        id: sbom_attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.0.0
        with:
          subject-name: 951034765053.dkr.ecr.ap-northeast-1.amazonaws.com/toybaco/chatwoot
          subject-digest: ${{ steps.build.outputs.image_digest }}
          sbom-path: ${{ runner.temp }}/toybaco-chatwoot.spdx.json
          push-to-registry: true
          create-storage-record: false
          show-summary: false

      - name: exact digestのOpenVEX fixed分類を署名してOCIへ保存
        id: backport_vex
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.0.0
        with:
          subject-name: 951034765053.dkr.ecr.ap-northeast-1.amazonaws.com/toybaco/chatwoot
          subject-digest: ${{ steps.build.outputs.image_digest }}
          predicate-type: https://openvex.dev/ns/v0.2.0
          predicate-path: ${{ runner.temp }}/chatwoot-source-backport/openvex.json
          push-to-registry: true
          create-storage-record: false
          show-summary: false

      - name: 生scan・実imageの修正証拠・独立分類を署名してOCIへ保存
        id: backport_proof
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.0.0
        with:
          subject-name: 951034765053.dkr.ecr.ap-northeast-1.amazonaws.com/toybaco/chatwoot
          subject-digest: ${{ steps.build.outputs.image_digest }}
          predicate-type: https://toybaco.jp/attestations/chatwoot-ruby-llm-backport/v1
          predicate-path: ${{ runner.temp }}/chatwoot-source-backport/source-backport-classification.json
          push-to-registry: true
          create-storage-record: false
          show-summary: false

      - name: GitHub OCI provenance・SBOM署名を標準検証
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_DIGEST: ${{ steps.build.outputs.image_digest }}
        run: |
          set -Eeuo pipefail
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          image="oci://$ECR_REPOSITORY@$IMAGE_DIGEST"
          identity='https://github.com/Cyber-relations/chatwoot/.github/workflows/chatwoot-integration.yml@refs/heads/main'
          gh attestation verify "$image" \
            --repo Cyber-relations/chatwoot \
            --bundle-from-oci \
            --cert-identity "$identity" \
            --cert-oidc-issuer 'https://token.actions.githubusercontent.com' \
            --source-digest "$REPOSITORY_COMMIT" \
            --source-ref refs/heads/main \
            --deny-self-hosted-runners \
            --predicate-type 'https://slsa.dev/provenance/v1' >/dev/null
          gh attestation verify "$image" \
            --repo Cyber-relations/chatwoot \
            --bundle-from-oci \
            --cert-identity "$identity" \
            --cert-oidc-issuer 'https://token.actions.githubusercontent.com' \
            --source-digest "$REPOSITORY_COMMIT" \
            --source-ref refs/heads/main \
            --deny-self-hosted-runners \
            --predicate-type 'https://spdx.dev/Document/v2.3' >/dev/null
          security="$RUNNER_TEMP/chatwoot-source-backport"
          gh attestation verify "$image" \
            --repo Cyber-relations/chatwoot \
            --bundle-from-oci \
            --cert-identity "$identity" \
            --cert-oidc-issuer 'https://token.actions.githubusercontent.com' \
            --source-digest "$REPOSITORY_COMMIT" \
            --source-ref refs/heads/main \
            --deny-self-hosted-runners \
            --predicate-type 'https://openvex.dev/ns/v0.2.0' --format json > "$security/verified-openvex.json"
          gh attestation verify "$image" \
            --repo Cyber-relations/chatwoot \
            --bundle-from-oci \
            --cert-identity "$identity" \
            --cert-oidc-issuer 'https://token.actions.githubusercontent.com' \
            --source-digest "$REPOSITORY_COMMIT" \
            --source-ref refs/heads/main \
            --deny-self-hosted-runners \
            --predicate-type 'https://toybaco.jp/attestations/chatwoot-ruby-llm-backport/v1' \
            --format json > "$security/verified-source-backport.json"
          node scripts/verify-chatwoot-ruby-llm-classification.mjs verify-attestations \
            "$security" config/chatwoot-ruby-llm-backport.json config/chatwoot-rails-backport.json
          printf 'Published %s:%s@%s from %s\n' \
            "$ECR_REPOSITORY" "$IMAGE_TAG" "$IMAGE_DIGEST" "$REPOSITORY_COMMIT"

  freshness:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.publish_reviewed_main)
    name: upstream tag・commit・amd64 digest freshness
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: ./bin/toybaco-chatwoot-upstream-freshness

  live-edge:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.publish_reviewed_main)
    name: production HSTS・TLS・nosniff read-only監視
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: ./bin/toybaco-chatwoot-live-edge-gate
